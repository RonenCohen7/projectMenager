<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" fill="none" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2C4A"/>
      <stop offset="1" stop-color="#123F5E"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset=".5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1B3A57"/>
      <stop offset="1" stop-color="#2A5577"/>
    </linearGradient>
    <linearGradient id="video" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A5F3FC"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="cubeTop2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDD6FE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="floor" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Floor glow + orbits -->
  <ellipse cx="350" cy="410" rx="250" ry="70" fill="url(#floor)"/>
  <ellipse cx="350" cy="400" rx="230" ry="62" stroke="#38BDF8" stroke-opacity=".35" stroke-dasharray="4 8">
    <animateTransform attributeName="transform" type="rotate" from="0 350 400" to="360 350 400" dur="60s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="350" cy="400" rx="290" ry="84" stroke="#8B5CF6" stroke-opacity=".25"/>

  <!-- Network lines -->
  <g stroke="#5EEAD4" stroke-opacity=".35" stroke-width="1.2">
    <path d="M70 120 L150 80 L230 110 M150 80 L120 200 M560 70 L600 160 L520 210"/>
  </g>
  <g fill="#5EEAD4" filter="url(#glow)">
    <circle cx="70" cy="120" r="4"><animate attributeName="opacity" values="1;.3;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="80" r="5"/>
    <circle cx="230" cy="110" r="3.5"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="200" r="3.5"/>
    <circle cx="560" cy="70" r="4"/>
    <circle cx="600" cy="160" r="5"><animate attributeName="opacity" values="1;.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="210" r="3.5"/>
  </g>

  <!-- Laptop base (thickness + top) -->
  <polygon points="170,350 440,251 530,301 260,400" fill="#0B2135"/>
  <polygon points="170,340 440,241 530,291 260,390" fill="url(#base)" stroke="url(#frame)" stroke-width="1.5"/>
  <!-- keyboard grid -->
  <g stroke="#7DD3FC" stroke-opacity=".25">
    <path d="M205 344 L455 252 M222 354 L472 262 M239 364 L489 272 M256 374 L506 282"/>
    <path d="M240 331 L330 381 M290 313 L380 363 M340 295 L430 345 M390 277 L480 327"/>
  </g>

  <!-- Screen glow -->
  <polygon points="170,150 440,51 440,241 170,340" fill="#38BDF8" opacity=".35" filter="url(#soft)"/>

  <!-- Screen (skewed) -->
  <g transform="matrix(0.9 -0.33 0 1 170 150)">
    <rect width="300" height="190" rx="10" fill="url(#screen)" stroke="url(#frame)" stroke-width="2.5"/>
    <!-- top bar -->
    <rect x="12" y="12" width="276" height="16" rx="5" fill="#1E4C70"/>
    <circle cx="24" cy="20" r="3" fill="#F87171"/><circle cx="34" cy="20" r="3" fill="#FBBF24"/><circle cx="44" cy="20" r="3" fill="#34D399"/>
    <!-- video player -->
    <rect x="12" y="38" width="176" height="100" rx="8" fill="url(#video)" opacity=".9"/>
    <circle cx="100" cy="88" r="20" fill="#FFFFFF" fill-opacity=".9"/>
    <polygon points="94,78 94,98 110,88" fill="#3B82F6"/>
    <rect x="20" y="126" width="160" height="4" rx="2" fill="#FFFFFF" fill-opacity=".35"/>
    <rect x="20" y="126" width="104" height="4" rx="2" fill="#FFFFFF">
      <animate attributeName="width" values="20;160;20" dur="9s" repeatCount="indefinite"/>
    </rect>
    <!-- lessons -->
    <g fill="#1E4C70">
      <rect x="198" y="38" width="90" height="28" rx="6"/>
      <rect x="198" y="74" width="90" height="28" rx="6"/>
      <rect x="198" y="110" width="90" height="28" rx="6"/>
    </g>
    <circle cx="210" cy="52" r="6" fill="#34D399"/>
    <circle cx="210" cy="88" r="6" fill="#34D399"/>
    <circle cx="210" cy="124" r="6" fill="#38BDF8"><animate attributeName="opacity" values="1;.35;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <g fill="#A5D8F3" fill-opacity=".7">
      <rect x="222" y="48" width="56" height="4" rx="2"/><rect x="222" y="56" width="36" height="3" rx="1.5"/>
      <rect x="222" y="84" width="56" height="4" rx="2"/><rect x="222" y="92" width="40" height="3" rx="1.5"/>
      <rect x="222" y="120" width="56" height="4" rx="2"/><rect x="222" y="128" width="30" height="3" rx="1.5"/>
    </g>
    <!-- quiz -->
    <rect x="12" y="148" width="86" height="30" rx="7" fill="#134E4A" stroke="#5EEAD4" stroke-opacity=".6"/>
    <rect x="106" y="148" width="86" height="30" rx="7" fill="#1E4C70"/>
    <rect x="200" y="148" width="88" height="30" rx="7" fill="#1E4C70"/>
    <path d="M30 163 l6 6 l12 -12" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating cube 1 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="5s" repeatCount="indefinite"/>
    <polygon points="500,160 530,143 560,160 530,177" fill="url(#cubeTop)"/>
    <polygon points="500,160 530,177 530,212 500,195" fill="#0E7490"/>
    <polygon points="530,177 560,160 560,195 530,212" fill="#155E75"/>
  </g>

  <!-- Floating cube 2 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 12; 0 0" dur="6s" repeatCount="indefinite"/>
    <polygon points="90,280 112,267 134,280 112,293" fill="url(#cubeTop2)"/>
    <polygon points="90,280 112,293 112,319 90,306" fill="#6D28D9"/>
    <polygon points="112,293 134,280 134,306 112,319" fill="#5B21B6"/>
  </g>

  <!-- Graduation cap -->
  <g filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="4.5s" repeatCount="indefinite"/>
    <polygon points="250,40 300,22 350,40 300,58" fill="#5EEAD4"/>
    <path d="M272 48 v16 c0 8 56 8 56 0 v-16 l-28 10 z" fill="#2DD4BF"/>
    <path d="M340 44 v20" stroke="#FBBF24" stroke-width="2.5"/>
    <circle cx="340" cy="67" r="3.5" fill="#FBBF24"/>
  </g>

  <!-- Small sparkles -->
  <g fill="#FFFFFF">
    <circle cx="470" cy="40" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="380" r="1.8"><animate attributeName="opacity" values="1;0;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="330" r="2"><animate attributeName="opacity" values="0;1;0" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="20" r="1.5"><animate attributeName="opacity" values="1;0;1" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
