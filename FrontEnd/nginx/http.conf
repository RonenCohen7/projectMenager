# Path deploy on the existing SeeYouTomorrow host.
# Caddy terminates HTTPS for whosintomorrow.com and forwards /pm to this nginx.
# The app is built with Vite base /pm/ and API base /pm/api/.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    absolute_redirect off;
    port_in_redirect off;

    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 2m;

    location = /pm {
        return 301 /pm/;
    }

    location = /pm/ {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location = /pm/api/live {
        proxy_pass http://backend:4000/api/live;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /pm/api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /pm/ {
        rewrite ^/pm/(.*)$ /$1 break;
        root /usr/share/nginx/html;
        try_files $uri $uri/ @pm_index;
    }

    location @pm_index {
        root /usr/share/nginx/html;
        rewrite ^ /index.html break;
    }
}
