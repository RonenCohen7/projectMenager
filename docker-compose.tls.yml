# HTTPS: docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build
# Needs ./certs/fullchain.pem + ./certs/privkey.pem (see README - HTTPS)

services:
  frontend:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./certbot-www:/var/www/certbot:ro
    command: ["/bin/sh", "-c", "cp /etc/nginx/tls.conf /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]
